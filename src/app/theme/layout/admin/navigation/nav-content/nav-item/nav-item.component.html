@if (item.url && !item.external) {
  <li [ngClass]="item.classes" [routerLinkActive]="['active']">
    <a
      class="nav-link"
      [target]="item.target ? '_blank' : '_self'"
      [routerLink]="[item.url]"
      (click)="closeMenuOnClick()"
    >
      <span class="pcoded-micon" (click)="closeMenuOnClick()" *ngIf="item.icon">
        <i class="feather" (click)="closeMenuOnClick()" [ngClass]="item.icon"></i>
      </span>
      <span class="pcoded-mtext" (click)="closeMenuOnClick()" *ngIf="item.icon; else noIcon">
        {{ item.title }}
      </span>
      <ng-template #noIcon>{{ item.title }}</ng-template>
    </a>
  </li>
}

@if (item.url && item.external) {
  <li [ngClass]="item.classes">
    <a
      class="nav-link"
      [target]="item.target ? '_blank' : '_self'"
      [href]="item.url"
    >
      <span class="pcoded-micon" *ngIf="item.icon">
        <i class="feather" [ngClass]="item.icon"></i>
      </span>
      <span class="pcoded-mtext" *ngIf="item.icon; else noIconExt">
        {{ item.title }}
      </span>
      <ng-template #noIconExt>{{ item.title }}</ng-template>
    </a>
  </li>
}
